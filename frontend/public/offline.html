<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amoura is offline</title>
<style>
:root{--bg:#fbf3f0;--ink:#3a1124;--rose:#e5667f;--burg:#5b1a34;--mute:#8a6572}
@media (prefers-color-scheme:dark){:root{--bg:#1b0d14;--ink:#fbeff0;--mute:#c4a0ab;--burg:#8a2a4d}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:12px 0 6px}
p{color:var(--mute);margin:0 0 22px}
button{border:0;border-radius:999px;padding:13px 26px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--rose),var(--burg));cursor:pointer}
</style></head>
<body><main><div style="font-size:54px" aria-hidden="true">💔</div><h1>You’re offline</h1><p>Amoura needs a connection to find your matches.</p><button onclick="location.reload()">Try again</button></main></body></html>
